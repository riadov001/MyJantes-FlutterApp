[deployment]
run = ["node", "app.js"]
deploymentTarget = "cloudrun"
build = ["echo", "No build step needed for Node.js application"]

[env]
NODE_ENV = "production"
PORT = "8080"
REPL_DEPLOYMENT = "true"

[cloudrun]
memory = "2Gi"
cpu = "2"
minInstances = 1
maxInstances = 10
concurrency = 100
port = 8080
timeoutSeconds = 300